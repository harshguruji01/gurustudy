    <!-- Main Left Page Body -->
    <path d="M 162 230 
             Q 214 236 248 260 
             L 248 356 
             Q 204 336 162 324 
             Z" 
          fill="#1E3A8A" />

    <!-- Right Page Group -->
    <!-- Main Right Page Body -->
    <path d="M 350 230 
             Q 298 236 264 260 
             L 264 356 
             Q 308 336 350 324 
             Z" 
          fill="#1E3A8A" />

    <!-- Outer Cover Ridge Right -->
    <path d="M 372 248 
             L 360 248 
             L 360 334 
             Q 312 348 268 366 
             L 268 380 
             Q 320 360 372 344 
             Z" 
          fill="#1E3A8A" />

    <!-- Book Spine Center Base -->
    <path d="M 244 374 
             Q 256 366 268 374 
             L 268 382 
             Q 256 374 244 382 
             Z" 
          fill="#1E3A8A" />
  </g>
